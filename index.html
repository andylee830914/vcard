</style></head><body><header><a class="brand" href="./"><b>✳</b> little space.</a><button class="share" id="share">↗ 分享名片</button></header><main><div class="top" hidden><div><div class="eyebrow"></div><h1><span style="color:#9bae72"></span></h1></div><p></p></div><div class="layout"><aside class="profile"><div class="avatar" id="avatar"></div><span class="spark" aria-hidden="true">✳</span><h2 id="name"></h2><div class="role" id="role"></div><p class="intro" id="intro"></p><p class="note" id="note"></p><div class="profile-bottom"><div class="location"><span id="location"></span><span class="status"><i class="dot"></i><span id="status"></span></span></div><a class="email" id="email"><span>Say hello.</span><span>↗</span></a><div class="demo"></div></div></aside><section class="right" aria-label="我的連結"><nav class="filters" aria-label="連結分類" hidden></nav><div class="grid" id="links"></div><div class="contact"><div><strong>有個有趣的想法？</strong><p>從一句 Hello，開始新的可能。</p></div><a id="contact">寫信給我 ↗</a></div></section></div></main><footer><span>© <span id="year"></span> <span id="footer-name"></span></span><span class="foot-note">Made with curiosity <span style="font-size:16px">✳</span> 保持好奇，保持連結。</span></footer><div class="toast" hidden role="status"></div><script>

fetch('./profile.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{document.title=p.page_title||p.name;for(const key of ['name','role','intro','note','status'])document.getElementById(key).textContent=p[key]||'';const avatar=document.getElementById('avatar');avatar.textContent=p.initials||'';if(p.avatar){const image=document.createElement('img');image.alt=p.avatar_alt||p.name;image.src=p.avatar;image.onerror=()=>{avatar.textContent=p.initials||''};avatar.replaceChildren(image);}document.getElementById('location').textContent='⌖ '+p.location;document.getElementById('footer-name').textContent=p.name;document.getElementById('year').textContent=new Date().getFullYear();for(const id of ['email','contact'])document.getElementById(id).href='mailto:'+p.email;const categories=[null,...new Set(p.links.map(x=>x.category))];const nav=document.querySelector('.filters');nav.hidden=p.show_categories!=='true';for(const category of categories){const b=document.createElement('button');b.textContent=category===null?p.all_label:category;b.classList.toggle('active',category===null);b.setAttribute('aria-pressed',category===null);b.onclick=()=>{for(const n of nav.children){n.classList.toggle('active',n===b);n.setAttribute('aria-pressed',n===b)}for(const card of document.querySelectorAll('.card'))card.hidden=category!==null&&card.dataset.category!==category;};nav.append(b)}p.links.forEach((l,i)=>{const a=document.createElement('a');a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.dataset.category=l.category;a.className='card '+l.type+(i===0?' wide':'');if(l.background){a.style.background=l.background;a.style.borderColor=l.background;}if(l.color){a.style.color=l.color;}const icon=document.createElement('div');icon.className=i===0?'tag':'icon';icon.textContent=i===0?p.featured_label:icons[l.type]||'↗';if(l.type==='discord'&&i!==0){icon.textContent='';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width','27');svg.setAttribute('height','24');svg.setAttribute('aria-hidden','true');const shape=document.createElementNS('http://www.w3.org/2000/svg','path');shape.setAttribute('d','M7 5 4 6C2 9 1 13 2 17l5 2 1-2a15 15 0 0 0 8 0l1 2 5-2c1-4 0-8-2-11l-3-1-1 2a17 17 0 0 0-8 0L7 5Z');shape.setAttribute('fill','currentColor');svg.append(shape);for(const x of ['8','16']){const eye=document.createElementNS('http://www.w3.org/2000/svg','ellipse');eye.setAttribute('cx',x);eye.setAttribute('cy','12');eye.setAttribute('rx','1.6');eye.setAttribute('ry','2');eye.setAttribute('fill',l.background||'#EDE9F7');svg.append(eye)}icon.append(svg)}const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');const h=document.createElement('h3');h.textContent=l.title;const d=document.createElement('p');d.textContent=l.description;if(l.color){d.style.color=l.color;d.style.opacity='0.85';icon.style.color=l.color;arrow.style.borderColor=l.color;}a.append(icon,arrow,h,d);if(i===0){const s=document.createElement('div');s.className='sculpture';s.setAttribute('aria-hidden','true');a.append(s)}document.getElementById('links').append(a)})}).catch(()=>{document.getElementById('links').textContent=document.documentElement.dataset.loadError});
